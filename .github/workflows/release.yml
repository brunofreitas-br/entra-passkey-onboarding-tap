name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Bicep
        run: |
          az bicep install

      - name: Test
        run: |
          dotnet test TapPasskeyOnboarding.slnx -c Release

      - name: Publish Web App
        run: |
          dotnet publish src/TapPasskeyOnboarding.Web/TapPasskeyOnboarding.Web.csproj \
            -c Release -o artifacts/web
          cd artifacts/web
          zip -qr ../web.zip .

      - name: Publish transition worker
        run: |
          dotnet publish src/TapPasskeyOnboarding.TransitionWorker/TapPasskeyOnboarding.TransitionWorker.csproj \
            -c Release -o artifacts/worker
          cd artifacts/worker
          zip -qr ../worker.zip .

      - name: Compile ARM template
        run: |
          az bicep build --file infra/main.bicep --outfile artifacts/azuredeploy.json

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum web.zip worker.zip azuredeploy.json > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/web.zip \
            artifacts/worker.zip \
            artifacts/azuredeploy.json \
            artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
